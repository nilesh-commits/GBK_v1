services:
  backend:
    build: ./backend
    container_name: windportal-backend
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      DATA_DIR: data
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # frontend service is added in Phase B (React + Vite on :5173)
