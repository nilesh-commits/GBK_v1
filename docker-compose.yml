services:
  backend:
    build: ./backend
    container_name: windportal-backend
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      DATA_DIR: data
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: windportal-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
