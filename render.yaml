# Render Blueprint for the backend (Docker web service).
# Create it in Render via: New > Blueprint > connect this repo.
#
# Data: the backend serves from a parquet cache that is not committed, so we run
# scripts/ingest.py on boot (fetches live Elexon Jan-2026 data) before starting
# uvicorn. `|| true` lets the service still start (degraded) if Elexon is briefly
# unreachable; it will have data on the next successful boot.
services:
  - type: web
    name: windportal-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt            # closest to UK; change if you prefer
    healthCheckPath: /api/health
    dockerCommand: sh start.sh
    envVars:
      # Set this to your Vercel frontend origin AFTER the frontend is deployed,
      # as a JSON array, e.g. ["https://your-app.vercel.app"]. Then redeploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: data
